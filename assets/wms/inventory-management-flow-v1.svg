    <circle cx="1026" cy="286" r="27" fill="#153969"/><text x="1026" y="295" class="number" font-size="23" text-anchor="middle">4</text>
    <rect x="1007" y="350" width="176" height="98" rx="14" fill="#e9f1fb"/>
    <path d="M1044 401l25 25 64-71" fill="none" stroke="#34a26f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1026 365h45" stroke="#24528a" stroke-width="7" stroke-linecap="round"/>
    <text x="1095" y="483" class="label" font-size="22" text-anchor="middle">재고 실사 · 차이 처리</text>
    <text x="1095" y="511" class="detail" font-size="15" text-anchor="middle">주기 실사 · 원인 분석</text>
