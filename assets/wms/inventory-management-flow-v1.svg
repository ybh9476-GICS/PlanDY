    <text x="195" y="511" class="detail" font-size="15" text-anchor="middle">품목 · 단위 · 로케이션</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="380" y="238" width="230" height="300" rx="24" fill="#fff" stroke="#dce5f0" stroke-width="2"/>
    <circle cx="426" cy="286" r="27" fill="#153969"/><text x="426" y="295" class="number" font-size="23" text-anchor="middle">2</text>
    <rect x="405" y="354" width="180" height="88" rx="14" fill="#e9f1fb"/>
    <path d="M430 399h130M451 377l-21 22 21 22M539 377l21 22-21 22" fill="none" stroke="#24528a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
