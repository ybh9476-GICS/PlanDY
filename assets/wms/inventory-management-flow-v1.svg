    <circle cx="1326" cy="286" r="27" fill="#153969"/><text x="1326" y="295" class="number" font-size="23" text-anchor="middle">5</text>
    <rect x="1305" y="350" width="180" height="98" rx="14" fill="#e9f1fb"/>
    <path d="M1337 425v-43h80M1337 403l40-40 40 40" fill="none" stroke="#24528a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1417 425v-43" stroke="#ff8a2a" stroke-width="8" stroke-linecap="round"/>
    <text x="1395" y="483" class="label" font-size="22" text-anchor="middle">보충 · 재배치 · 개선</text>
    <text x="1395" y="511" class="detail" font-size="15" text-anchor="middle">안전재고 · 회전율 · KPI</text>
