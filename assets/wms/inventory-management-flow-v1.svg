  <path d="M1395 574 C1395 700, 195 700, 195 574" fill="none" stroke="#7e94af" stroke-width="4" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
  <rect x="555" y="702" width="490" height="86" rx="18" fill="#eff4fa" stroke="#d6e1ee" stroke-width="2"/>
  <text x="800" y="738" class="label" font-size="20" text-anchor="middle">재고 정확도 향상 사이클</text>
  <text x="800" y="767" class="detail" font-size="16" text-anchor="middle">기준 데이터 → 실시간 반영 → 검증 → 개선을 반복합니다.</text>
