<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">재고 관리 운영 흐름</title>
  <desc id="desc">재고 기준 정의, 입출고 반영, 상태 분류, 재고 실사, 보충과 개선의 5단계 흐름</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102f5d"/>
      <stop offset="1" stop-color="#24528a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#142845" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ff8a2a"/>
    </marker>
    <style>
      .heading { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-weight: 800; fill: #fff; }
      .label { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-weight: 800; fill: #142d50; }
      .detail { font-family: Pretendard, "Noto Sans KR", Arial, sans-serif; font-weight: 500; fill: #50657e; }
      .number { font-family: Arial, sans-serif; font-weight: 800; fill: #fff; }
    </style>
  </defs>

  <rect width="1600" height="860" fill="#f7f9fc"/>
  <rect x="70" y="54" width="1460" height="114" rx="24" fill="url(#header)"/>
  <text x="130" y="111" class="heading" font-size="38">재고 관리 운영 흐름</text>
  <text x="130" y="143" class="heading" font-size="20" font-weight="500" opacity=".82">재고 정확도를 유지하는 WMS 5단계 관리 사이클</text>
  <circle cx="1450" cy="111" r="31" fill="#ff8a2a"/>
  <path d="M1436 111h28M1450 97v28" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

  <path d="M310 386 H391 M609 386 H690 M908 386 H989 M1207 386 H1288" fill="none" stroke="#ff8a2a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="238" width="230" height="300" rx="24" fill="#fff" stroke="#dce5f0" stroke-width="2"/>
    <circle cx="126" cy="286" r="27" fill="#153969"/><text x="126" y="295" class="number" font-size="23" text-anchor="middle">1</text>
    <rect x="102" y="342" width="186" height="108" rx="16" fill="#e9f1fb"/>
    <path d="M139 419h111M139 392h111M139 365h111" stroke="#24528a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="157" cy="365" r="8" fill="#ff8a2a"/><circle cx="157" cy="392" r="8" fill="#ff8a2a"/><circle cx="157" cy="419" r="8" fill="#ff8a2a"/>
