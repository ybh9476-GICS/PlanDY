    <circle cx="726" cy="286" r="27" fill="#153969"/><text x="726" y="295" class="number" font-size="23" text-anchor="middle">3</text>
    <rect x="703" y="350" width="184" height="98" rx="14" fill="#e9f1fb"/>
    <circle cx="742" cy="379" r="11" fill="#34a26f"/><circle cx="742" cy="411" r="11" fill="#ffb32d"/><circle cx="742" cy="437" r="11" fill="#d95d5d"/>
    <path d="M765 379h85M765 411h85M765 437h85" stroke="#24528a" stroke-width="6" stroke-linecap="round"/>
